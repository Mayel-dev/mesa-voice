name: Software checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: python tools/build_firmware.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I firmware/include firmware/test/test_audio_protocol.cpp -o /tmp/test_audio && /tmp/test_audio

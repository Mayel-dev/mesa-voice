[platformio]
default_envs = mesa_voice

[env:mesa_voice]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

[env:validation]
extends = env:mesa_voice
build_flags =
    ${env:mesa_voice.build_flags}
    -DMESA_VALIDATION_BUILD

